name: CI

# Every push runs everything, the Jev live suite included, and uploads test
# coverage to Codecov. A pull request from a branch in this repository
# already ran on its push, so the jobs run on a pull request only when it
# comes from a fork. A fork gets no secrets, so its run skips the Jev suite
# and the upload.
#
# The Apple live suite is not here: GitHub's macOS runners are virtual
# machines, and Apple Intelligence does not run in one. See TESTING.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Apple tests need macOS 26 at run time, so the runner is macos-26.
  # Pin Xcode so a change of the image's default does not change the build.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  macos:
    name: macOS tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # swift-syntax is the slow part of a cold build. Coverage changes the
      # compiler flags, so the key names it.
      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-coverage-${{ hashFiles('Package.resolved') }}

      # One run, because each coverage run clears the one before it. A fork's
      # pull request has no key, so it skips the Jev suite.
      - name: Tests
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SKIP_JEV: ${{ github.event_name == 'pull_request' }}
        run: |
          skip=(--skip GuidedGenerationLiveTests)
          if [ "$SKIP_JEV" = "true" ]; then skip+=(--skip JevLive); fi
          swift test -Xswiftc -warnings-as-errors --enable-code-coverage "${skip[@]}"

      # Naming the Sources folder keeps the report to the package's own code:
      # no tests, no swift-syntax, no generated test runner.
      - name: Export coverage
        if: github.event_name != 'pull_request'
        run: |
          bin=$(swift build --show-bin-path)
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$bin/codecov/default.profdata" \
            "$bin/DecisionModelsPackageTests.xctest/Contents/MacOS/DecisionModelsPackageTests" \
            "$PWD/Sources" \
            > coverage.lcov

      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  ios:
    name: iOS build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # swift build builds for the Mac only. This is the one check of the
      # package's iOS 18 claim.
      - name: Build for the iOS Simulator
        run: >-
          xcodebuild build
          -scheme DecisionModels-Package
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation
