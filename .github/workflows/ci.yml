name: CI

# Every push runs everything, the Jev live suite included. A pull request
# from a branch in this repository already ran on its push, so the jobs run
# on a pull request only when it comes from a fork. A fork gets no secrets,
# so its run skips the Jev step.
#
# The Apple live suite is not here: GitHub's macOS runners are virtual
# machines, and Apple Intelligence does not run in one. See TESTING.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Apple tests need macOS 26 at run time, so the runner is macos-26.
  # Pin Xcode so a change of the image's default does not change the build.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  macos:
    name: macOS tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # swift-syntax is the slow part of a cold build.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('Package.resolved') }}

      - name: Offline tests
        run: swift test -Xswiftc -warnings-as-errors --skip JevLive --skip GuidedGenerationLiveTests

      # Same flags as the step above, so this step reuses its build.
      - name: Jev live tests
        if: github.event_name != 'pull_request'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: swift test -Xswiftc -warnings-as-errors --filter JevLive

  ios:
    name: iOS build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # swift build builds for the Mac only. This is the one check of the
      # package's iOS 18 claim.
      - name: Build for the iOS Simulator
        run: >-
          xcodebuild build
          -scheme DecisionModels-Package
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation
